name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend type-check and build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  backend:
    name: Go test and vet
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev portaudio19-dev \
            xorg-dev libx11-dev libx11-xcb-dev libxtst-dev \
            libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libxcb-xkb-dev libxinerama-dev libxrandr-dev libxt-dev xvfb
      # main.go embeds frontend/dist, which a fresh checkout does not have — the
      # Go package will not even load without it. The release workflow already
      # builds the frontend first for this reason; this job did not, so it could
      # never have passed.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: xvfb-run -a go test ./...
      - run: go vet ./...

  # The Go suite had never run on macOS, and the first time it did it found a
  # real bug: /tmp there is a symlink to /private/tmp, so a path comparison that
  # resolved only one side silently dropped every match. Cheap insurance against
  # the next platform assumption.
  go-test-macos:
    name: Go test (macOS)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
      - name: Install native build dependencies
        run: brew install portaudio
      # Only the packages that build without a display. The Wails app itself is
      # covered by the release workflow, which builds the full bundle.
      - run: go test ./session/ ./updater/
      - run: go vet ./session/ ./updater/
