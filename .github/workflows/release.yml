name: Release

# Builds the Wails desktop app on Ubuntu (WebKitGTK 4.1), packages a .deb whose
# name matches what the in-app updater downloads
# (asmgr-desktop_<version>_linux_x86_64.deb), and publishes a GitHub Release.
#
# Triggers:
#   - pushing a tag like v0.5.0  → automatic release for that tag
#   - manual run (workflow_dispatch) with a version input → tags + releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.6.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build & Release (Linux)
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # For a manual run, create and push the tag first so the release attaches to it.
      - name: Create tag (manual dispatch only)
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ github.event.inputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)([.-]?[0-9]+)?)?$ ]]; then
            echo "Not a SemVer tag (vX.Y.Z, optionally -alpha/-beta/-rc): $RELEASE_TAG" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            if [ "$(git rev-list -n 1 "$RELEASE_TAG")" != "$(git rev-parse HEAD)" ]; then
              echo "Tag $RELEASE_TAG exists on a different commit" >&2
              exit 1
            fi
            if release_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null) && [ "$release_draft" != "true" ]; then
              echo "Published release already exists for $RELEASE_TAG" >&2
              exit 1
            fi
            echo "Reusing same-commit tag for a failed/draft release retry: $RELEASE_TAG"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Resolve version
        id: ver
        env:
          MANUAL_TAG: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)([.-]?[0-9]+)?)?$ ]]; then
            echo "Not a SemVer tag (vX.Y.Z, optionally -alpha/-beta/-rc): $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            build-essential pkg-config \
            portaudio19-dev \
            xorg-dev \
            libx11-dev libx11-xcb-dev libxtst-dev libxcb1-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb-xkb-dev \
            libxinerama-dev libxrandr-dev libxt-dev \
            xvfb

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Test and type-check
        # The frontend must be built BEFORE `go test`: main.go embeds
        # frontend/dist (go:embed), which doesn't exist on a fresh checkout,
        # so the Go package fails to even load without it.
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          xvfb-run -a go test ./...
          go vet ./...
          npm run check --prefix frontend
          npm test --prefix frontend

      - name: Set release metadata
        env:
          VERSION: ${{ steps.ver.outputs.num }}
        run: |
          jq --arg version "$VERSION" '.info.productVersion = $version' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build (Wails, webkit2_41)
        # Wails' "generating bindings" step runs the app's Go init() code, and a
        # dependency (robotn/gohook, global hotkey) calls XOpenDisplay on init —
        # which segfaults on a headless runner. Run the build under a virtual X
        # server (Xvfb) so a display exists during binding generation.
        env:
          VERSION: ${{ steps.ver.outputs.num }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          xvfb-run -a wails build -tags webkit2_41 -clean -ldflags "-X main.Version=$VERSION"

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3

      - name: Package .deb and .rpm (names match the in-app updater)
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export VERSION="${{ steps.ver.outputs.num }}"
          # nfpm's arch is 'amd64', but the OUTPUT names use x86_64 to match
          # updater/updater.go (BinaryName_version_linux_x86_64.{deb,rpm}).
          nfpm package -f build/nfpm.yaml -p deb -t \
            "asmgr-desktop_${VERSION}_linux_x86_64.deb"
          nfpm package -f build/nfpm.yaml -p rpm -t \
            "asmgr-desktop_${VERSION}_linux_x86_64.rpm"
          tar -C build/bin -czf "asmgr-desktop_${VERSION}_linux_amd64.tar.gz" asmgr-desktop
          for asset in *.deb *.rpm *.tar.gz; do
            sha256sum "$asset" > "$asset.sha256"
          done
          ls -la *.deb *.rpm *.tar.gz *.sha256

      # The release notes come from CHANGELOG.md, so the release page says what
      # changed rather than repeating the project description every time.
      # Falls back to a note pointing at the changelog if the version has no
      # section — better than silently publishing an empty body.
      - name: Extract release notes from CHANGELOG
        id: notes
        run: |
          V="${{ steps.ver.outputs.num }}"
          if [ -f CHANGELOG.md ]; then
            awk -v ver="$V" '
              $0 ~ "^## " ver " " || $0 == "## " ver { found = 1; next }
              found && /^## / { exit }
              found { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)." > release-notes.md
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            cat release-notes.md
            echo
            cat <<'FOOTER'
          **Downloads**
          - Linux (Debian/Ubuntu): `.deb`
          - Linux (Fedora/RHEL): `.rpm`
          - Linux user-local install: `linux_amd64.tar.gz`
          - macOS (Apple Silicon): `darwin_arm64.tar.gz`
          - Windows x64 (installer): `windows_amd64_setup.exe`
          - Windows x64 (portable): `windows_amd64.tar.gz`

          Linux and macOS need `tmux` at runtime; Windows uses
          [psmux](https://github.com/psmux/psmux) instead and does not require tmux.
          FOOTER
            echo CHANGELOG_EOF
          } >> "$GITHUB_OUTPUT"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          body: ${{ steps.notes.outputs.body }}
          files: |
            asmgr-desktop_${{ steps.ver.outputs.num }}_linux_x86_64.deb
            asmgr-desktop_${{ steps.ver.outputs.num }}_linux_x86_64.deb.sha256
            asmgr-desktop_${{ steps.ver.outputs.num }}_linux_x86_64.rpm
            asmgr-desktop_${{ steps.ver.outputs.num }}_linux_x86_64.rpm.sha256
            asmgr-desktop_${{ steps.ver.outputs.num }}_linux_amd64.tar.gz
            asmgr-desktop_${{ steps.ver.outputs.num }}_linux_amd64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS build. Wails uses the native WKWebView here (NO webkit2_41 tag).
  # CGO is required (portaudio/CoreAudio, gohook/Cocoa). The Linux job owns the
  # tag; this job only builds and uploads its assets to the same release.
  # NOTE: tmux is still required at runtime (install via Homebrew). Dictation
  # bits that are Linux-only (PulseAudio, uinput) fall back to no-op stubs.
  # Required repository secrets: BUILD_CERTIFICATE_BASE64, P12_PASSWORD,
  # KEYCHAIN_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID.
  release-macos:
    name: Build & Release (macOS)
    needs: release
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: ver
        env:
          MANUAL_TAG: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)([.-]?[0-9]+)?)?$ ]]; then
            echo "Not a SemVer tag (vX.Y.Z, optionally -alpha/-beta/-rc): $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Install dependencies (PortAudio)
        run: brew install portaudio

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Set release metadata
        env:
          VERSION: ${{ steps.ver.outputs.num }}
        run: |
          jq --arg version "$VERSION" '.info.productVersion = $version' wails.json > wails.json.tmp
          mv wails.json.tmp wails.json

      - name: Build (Wails, macOS arm64)
        # Build arm64 only: the macos-14 runner is Apple Silicon and Homebrew's
        # portaudio is arm64-only, so a universal build fails to link the x86_64
        # slice. This artifact therefore supports Apple Silicon Macs only.
        env:
          VERSION: ${{ steps.ver.outputs.num }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ ! "$APPLE_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPLE_TEAM_ID must be the 10-character TeamIdentifier of the signing certificate" >&2
            exit 1
          fi
          export PATH="$PATH:$(go env GOPATH)/bin"
          wails build -platform darwin/arm64 -clean \
            -ldflags "-X main.Version=$VERSION -X asmgr-desktop/updater.ExpectedMacTeamID=$APPLE_TEAM_ID"

      - name: Bundle PortAudio runtime
        run: |
          APP="build/bin/asmgr-desktop.app"
          EXE="$APP/Contents/MacOS/asmgr-desktop"
          FRAMEWORKS="$APP/Contents/Frameworks"
          PORTAUDIO=$(otool -L "$EXE" | awk '/libportaudio/{print $1; exit}')
          if [ -z "$PORTAUDIO" ] || [ ! -f "$PORTAUDIO" ]; then
            echo "PortAudio dylib dependency was not found" >&2
            exit 1
          fi
          mkdir -p "$FRAMEWORKS"
          cp "$PORTAUDIO" "$FRAMEWORKS/libportaudio.2.dylib"
          install_name_tool -change "$PORTAUDIO" '@executable_path/../Frameworks/libportaudio.2.dylib' "$EXE"
          if otool -L "$EXE" | grep -q '/opt/homebrew.*libportaudio'; then
            echo "App still references Homebrew PortAudio" >&2
            exit 1
          fi

      # Renamed before packaging, so the archive carries the new name and an
      # update applies it. macOS shows the bundle's DIRECTORY name in Finder and
      # Launchpad whatever CFBundleDisplayName says — verified with mdls — so
      # this is the only way the app appears under its own name.
      - name: Rename the bundle to the product name
        run: mv "build/bin/asmgr-desktop.app" "build/bin/Agent Session Manager.app"

      # GitHub's documented CI pattern: keep the Developer ID .p12 as a
      # base64-encoded secret and import it into an ephemeral keychain. A
      # provisioning profile is not required for direct macOS distribution.
      - name: Import Developer ID certificate
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          for NAME in BUILD_CERTIFICATE_BASE64 P12_PASSWORD KEYCHAIN_PASSWORD; do
            if [ -z "${!NAME}" ]; then
              echo "Required macOS signing secret $NAME is not configured" >&2
              exit 1
            fi
          done

          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk '/Developer ID Application/ {print $2; exit}')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "The imported certificate is not a valid Developer ID Application identity" >&2
            security find-identity -v -p codesigning "$KEYCHAIN_PATH" >&2 || true
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Sign with hardened runtime
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          APP="build/bin/Agent Session Manager.app"
          EXE="$APP/Contents/MacOS/asmgr-desktop"
          DYLIB="$APP/Contents/Frameworks/libportaudio.2.dylib"
          ENTITLEMENTS="build/darwin/entitlements.plist"

          # Sign nested code from the inside out, then seal the app bundle.
          # --timestamp and --options runtime are required for notarization.
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$DYLIB"
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" \
            --sign "$MACOS_SIGNING_IDENTITY" "$EXE"
          codesign --force --timestamp --options runtime --entitlements "$ENTITLEMENTS" \
            --sign "$MACOS_SIGNING_IDENTITY" "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

          # Inspect the final signed product, not merely the source files: a
          # missing codesign flag or Wails template regression must fail here.
          SIGNED_ENTITLEMENTS="$RUNNER_TEMP/asmgr-signed-entitlements.plist"
          codesign -d --entitlements :- "$APP" > "$SIGNED_ENTITLEMENTS"
          [ "$(plutil -extract com.apple.security.device.audio-input raw -o - "$SIGNED_ENTITLEMENTS")" = "true" ]
          test -n "$(plutil -extract NSMicrophoneUsageDescription raw -o - "$APP/Contents/Info.plist")"
          SIGNED_TEAM_ID=$(codesign -dv --verbose=4 "$APP" 2>&1 | awk -F= '/^TeamIdentifier=/ {print $2; exit}')
          if [ "$SIGNED_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "Signed bundle TeamIdentifier $SIGNED_TEAM_ID does not match configured $APPLE_TEAM_ID" >&2
            exit 1
          fi

      - name: Notarize and staple
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for NAME in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!NAME}" ]; then
              echo "Required macOS notarization secret $NAME is not configured" >&2
              exit 1
            fi
          done

          APP="build/bin/Agent Session Manager.app"
          NOTARY_ZIP="$RUNNER_TEMP/asmgr-notarization.zip"
          ditto -c -k --keepParent "$APP" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      - name: Package .tar.gz (name matches the in-app updater)
        run: |
          V="${{ steps.ver.outputs.num }}"
          tar -C build/bin -czf "asmgr-desktop_${V}_darwin_arm64.tar.gz" "Agent Session Manager.app"
          shasum -a 256 "asmgr-desktop_${V}_darwin_arm64.tar.gz" > "asmgr-desktop_${V}_darwin_arm64.tar.gz.sha256"
          ls -la *.tar.gz *.sha256

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            asmgr-desktop_${{ steps.ver.outputs.num }}_darwin_arm64.tar.gz
            asmgr-desktop_${{ steps.ver.outputs.num }}_darwin_arm64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean up signing material
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12" "$RUNNER_TEMP/asmgr-notarization.zip"

  # Windows build. Wails uses the native WebView2 (no webkit2_41 tag). CGO is
  # required (portaudio); we get a gcc toolchain + portaudio via MSYS2.
  # NOTE: the app uses native psmux at runtime; the UI can install it with
  # winget, and also shows manual winget/Chocolatey/GitHub instructions.
  release-windows:
    name: Build & Release (Windows)
    needs: release
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # Go and Node are installed on the Windows PATH below; path-type 'inherit'
      # makes the MSYS2 shell see the full Windows PATH so `go`/`npx` are found.
      - name: Setup MSYS2 (gcc + portaudio)
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: UCRT64
          update: true
          path-type: inherit
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-portaudio

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Resolve version
        id: ver
        env:
          MANUAL_TAG: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="$MANUAL_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)([.-]?[0-9]+)?)?$ ]]; then
            echo "Not a SemVer tag (vX.Y.Z, optionally -alpha/-beta/-rc): $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "num=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.14.0

      - name: Set release metadata
        env:
          VERSION: ${{ steps.ver.outputs.num }}
        run: |
          node -e 'const fs=require("fs"); const p="wails.json"; const c=JSON.parse(fs.readFileSync(p)); c.info.productVersion=process.env.VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2)+"\n")'

      - name: Build (Wails, Windows amd64)
        env:
          VERSION: ${{ steps.ver.outputs.num }}
        run: |
          export PATH="$PATH:$(go env GOPATH)/bin"
          export CGO_ENABLED=1
          wails build -platform windows/amd64 -clean -ldflags "-X main.Version=$VERSION"

      - name: Bundle UCRT64 runtime DLLs
        run: |
          EXE="build/bin/asmgr-desktop.exe"
          mapfile -t DLLS < <(ldd "$EXE" | awk '$3 ~ /^\/ucrt64\/bin\// {print $3}')
          if [ "${#DLLS[@]}" -eq 0 ]; then
            echo "No UCRT64 runtime DLL dependencies detected" >&2
            exit 1
          fi
          printf '%s\n' "${DLLS[@]}"
          cp "${DLLS[@]}" build/bin/
          if ! ls build/bin/*portaudio*.dll >/dev/null 2>&1; then
            echo "PortAudio runtime DLL was not bundled" >&2
            exit 1
          fi

      - name: Package .tar.gz (name matches the in-app updater)
        run: |
          V="${{ steps.ver.outputs.num }}"
          (cd build/bin && tar -czf "../../asmgr-desktop_${V}_windows_amd64.tar.gz" "asmgr-desktop.exe" ./*.dll)
          sha256sum "asmgr-desktop_${V}_windows_amd64.tar.gz" > "asmgr-desktop_${V}_windows_amd64.tar.gz.sha256"
          ls -la *.tar.gz *.sha256

      # The installer needs the same DLLs the archive ships. They are copied out
      # of build/bin first because the -nsis build below rewrites that directory
      # and would otherwise leave ARG_WAILS_DLL_DIR pointing at an exe with no
      # libraries beside it — an installer that produces an app that cannot start.
      - name: Build NSIS installer
        run: |
          V="${{ steps.ver.outputs.num }}"
          export PATH="$PATH:$(go env GOPATH)/bin"
          export CGO_ENABLED=1
          mkdir -p build/dlls
          cp build/bin/*.dll build/dlls/
          # NSIS demands a numeric X.X.X.X version, so a pre-release tag like
          # 0.9.7-beta1 has to have its suffix stripped for the resource block —
          # project.nsi appends ".0" to whatever wails.json carries. The binary
          # itself keeps the full version via -ldflags; this only affects the
          # installer's file properties.
          export NSIS_VERSION="${V%%-*}"
          echo "installer resource version: $NSIS_VERSION (binary keeps $V)"
          node -e 'const fs=require("fs"); const p="wails.json"; const c=JSON.parse(fs.readFileSync(p)); c.info.productVersion=process.env.NSIS_VERSION; fs.writeFileSync(p, JSON.stringify(c, null, 2)+"\n")'
          wails build -platform windows/amd64 -nsis -skipbindings \
            -ldflags "-X main.Version=$V"
          INSTALLER="build/bin/asmgr-desktop-amd64-installer.exe"
          if [ ! -f "$INSTALLER" ]; then
            echo "NSIS installer was not produced" >&2
            ls -la build/bin >&2
            exit 1
          fi
          cp "$INSTALLER" "asmgr-desktop_${V}_windows_amd64_setup.exe"
          sha256sum "asmgr-desktop_${V}_windows_amd64_setup.exe" \
            > "asmgr-desktop_${V}_windows_amd64_setup.exe.sha256"
          ls -la *_setup.exe*

      # The DLL glob in project.nsi is /nonfatal, so a wrong path would produce
      # an installer that silently omits them — and an app that fails to start
      # only on the user's machine. This checks the actual payload rather than
      # the installer's size, which says little once everything is compressed.
      - name: Verify the installer bundles the runtime DLLs
        run: |
          V="${{ steps.ver.outputs.num }}"
          SETUP="asmgr-desktop_${V}_windows_amd64_setup.exe"
          # 7-Zip reads NSIS archives and ships with the runner image.
          LISTING=$("/c/Program Files/7-Zip/7z.exe" l "$SETUP")
          if [ -z "$LISTING" ]; then
            echo "Could not inspect the installer; refusing to publish an unchecked payload" >&2
            exit 1
          fi
          MISSING=0
          for DLL in build/dlls/*.dll; do
            NAME=$(basename "$DLL")
            if ! grep -qiF "$NAME" <<<"$LISTING"; then
              echo "Installer is missing $NAME" >&2
              MISSING=1
            fi
          done
          if ! grep -qiF "asmgr-desktop.exe" <<<"$LISTING"; then
            echo "Installer is missing the executable" >&2
            MISSING=1
          fi
          [ "$MISSING" -eq 0 ] || exit 1
          echo "Installer carries the executable and every runtime DLL"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          draft: true
          prerelease: ${{ contains(steps.ver.outputs.tag, '-') }}
          fail_on_unmatched_files: true
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            asmgr-desktop_${{ steps.ver.outputs.num }}_windows_amd64.tar.gz
            asmgr-desktop_${{ steps.ver.outputs.num }}_windows_amd64.tar.gz.sha256
            asmgr-desktop_${{ steps.ver.outputs.num }}_windows_amd64_setup.exe
            asmgr-desktop_${{ steps.ver.outputs.num }}_windows_amd64_setup.exe.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish complete release
    needs:
      - release
      - release-macos
      - release-windows
    runs-on: ubuntu-24.04
    steps:
      - name: Publish only after every platform and checksum is uploaded
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        # A tag carrying a pre-release suffix is published as one, so it does
        # not become "Latest" and the in-app updater does not offer it to
        # everybody. Without this a test build for one platform would reach
        # every user as an upgrade.
        run: |
          if [[ "$RELEASE_TAG" =~ -(alpha|beta|rc)([.-]?[0-9]+)?$ ]]; then
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          else
            gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          fi
